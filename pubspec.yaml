name: campus_lost_found
description: A mobile application for managing lost and found items on campus.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.3
  provider: ^6.0.0
  image_picker: ^1.2.1
  file_picker: ^5.2.7
  google_fonts: ^6.3.2
  url_launcher: ^6.1.7
  shared_preferences: ^2.1.1
  connectivity_plus: ^4.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFCFCFC"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter_native_splash:
  image: assets/images/app_logo.png
  color: "#ffffff"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
