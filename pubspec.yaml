name: campus_lost_found # This must match your project folder name
description: A mobile application for managing lost and found items on campus.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0' # Updated for compatibility with your Flutter 3.38.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0 # Required for your supabase_service.dart file
  provider: ^6.0.0
  image_picker: ^0.8.7+3
  google_fonts: ^5.0.0
  url_launcher: ^6.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFCFCFC"
  adaptive_icon_foreground: "assets/app_logo.png"

flutter_native_splash:
  image: assets/app_logo.png
  color: "#ffffff" # This sets the splash screen background to white
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png